vulnerabilities:
  # gh v2.92.0 is the latest stable GitHub CLI release as of 2026-05-15,
  # but the official Linux deb is built with Go 1.26.2. Revisit when gh ships
  # a stable build using Go >= 1.26.3.
  - id: CVE-2026-33811
    paths:
      - 'usr/bin/gh'
    expired_at: 2026-06-15
    statement: Upstream latest stable GitHub CLI has not yet been rebuilt with the fixed Go stdlib.
  - id: CVE-2026-33814
    paths:
      - 'usr/bin/gh'
    expired_at: 2026-06-15
    statement: Upstream latest stable GitHub CLI has not yet been rebuilt with the fixed Go stdlib.
  - id: CVE-2026-39820
    paths:

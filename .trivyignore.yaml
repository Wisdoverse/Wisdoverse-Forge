  # npm is bundled by the upstream Node image and retained for agent overlay
  # builds and operator use. These are path-scoped to npm's bundled
  # dependencies and expire quickly so they are removed when Node/npm refreshes.
  - id: CVE-2026-33671
    paths:
      - 'usr/local/lib/node_modules/npm/node_modules/tinyglobby/node_modules/picomatch/package.json'
    expired_at: 2026-06-15
    statement: Upstream Node/npm image bundle has not yet rebased picomatch to the fixed version.

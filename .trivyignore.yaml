    expired_at: 2026-06-15
    statement: Upstream latest stable GitHub CLI has not yet been rebuilt with the fixed Go stdlib.
  - id: CVE-2026-42499
    paths:
      - 'usr/bin/gh'
    expired_at: 2026-06-15
    statement: Upstream latest stable GitHub CLI has not yet been rebuilt with the fixed Go stdlib.

  # Docker Compose v5.1.3 is the latest stable Compose release as of 2026-05-15.
  # These suppressions are path-scoped to the official Compose plugin only and
  # expire quickly so the next upstream rebuild has to remove them.
  - id: CVE-2026-34040
    paths:
      - 'usr/local/lib/docker/cli-plugins/docker-compose'
    expired_at: 2026-06-15
    statement: Upstream latest stable Docker Compose has not yet rebased github.com/docker/docker to the fixed version.
  - id: CVE-2026-39883
    paths:
      - 'usr/local/lib/docker/cli-plugins/docker-compose'
    expired_at: 2026-06-15
    statement: Upstream latest stable Docker Compose has not yet rebased OpenTelemetry Go SDK to the fixed version.
  - id: CVE-2026-32280

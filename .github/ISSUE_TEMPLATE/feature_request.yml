name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Please search existing issues and discussions first.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user or operator problem does this solve? Who is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Sketch the UX / API / CLI shape if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Backend (Rust API / orchestrator)
        - Frontend (React / FSD)
        - Platform CLI (agentforge)
        - Container CLI / agents
        - Deployment / Docker / Compose
        - Documentation
        - Other
    validations:
      required: true

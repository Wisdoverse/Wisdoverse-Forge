name: Bug report
description: Report a reproducible problem in Wisdoverse Forge
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues first.
        For security vulnerabilities, do NOT use this form — report privately via GitHub Security Advisories (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: When I ..., the app ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps so a maintainer can reproduce it.
      placeholder: |
        1. Run `make quickstart-local`
        2. Open http://localhost:4002
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Local trial (make quickstart-local)
        - Self-hosted single host (prod-ext / quickstart-selfhost)
        - Development (npm run dev + make dev)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker / Docker Compose version, Node.js version.
      placeholder: |
        OS: Ubuntu 24.04
        Docker: 27.x, Compose v2.x
        Node: 24.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server / orchestrator / browser-console output. Redact secrets, hostnames, and tokens.
      render: shell

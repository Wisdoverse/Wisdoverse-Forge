# =============================================================================
# Release Supply Chain — sign artifacts + generate SBOMs
#
# Triggers: GitHub release published, workflow_dispatch (manual re-run).
# This workflow is purely additive to the main release pipeline. It runs
# after a release is published — by which point `release.yml`'s
# `release-binaries` job has already attached the cross-platform
# `agentforge-*` and `agentforge-sidecar-*` binaries to the release — and
# uploads signatures + SBOMs as additional release assets.
#
# Signing uses Sigstore keyless cosign (OIDC, no long-lived keys). The OIDC
# identity is bound to this workflow file AT THE RELEASE TAG REF, so any
# artifact signed by a fork, a different workflow, or a different tag will
# fail `agentforge verify`.
#
# IMPORTANT — workflow_dispatch identity constraint:
#   `agentforge verify` (rust/crates/cli/src/cmd/verify.rs) requires the Fulcio
#   cert subject to end with `@refs/tags/<tag>`. A workflow_dispatch run from a
#   branch would otherwise produce `@refs/heads/<branch>` and fail verification.
#   To keep both trigger paths identical, manual runs REQUIRE a `tag` input and
#   `actions/checkout` checks out that exact tag ref, so the OIDC claim is
#   always `@refs/tags/<tag>`. Re-runs therefore only work against a real,
#   already-published tag — never an arbitrary branch.
#
# SBOMs are generated in CycloneDX JSON format by syft (Anchore) and uploaded
# alongside `.sig.bundle` files. Downstream operators can run:
#
#   agentforge verify --tag v1.2.3 ./agentforge-sidecar-linux-amd64
#
# See docs/runbooks/host-cli-agent-enrollment.md for the full operator path.
# =============================================================================

name: Release Supply Chain (sign + SBOM)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # Must be an already-published release tag (e.g. v1.2.3). The run checks
        # out this exact tag ref so the cosign OIDC identity is bound to
        # `@refs/tags/<tag>`, matching `agentforge verify`. A branch ref would
        # produce a signature that fails verification.
        description: 'Published release tag to sign (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sign-and-sbom:
    name: Sign release artifacts + generate SBOM
    runs-on: ubuntu-latest

    steps:
      # Check out the EXACT release tag ref on both trigger paths so the cosign
      # Fulcio OIDC identity is `...release-supply-chain.yml@refs/tags/<tag>`,
      # which is what `agentforge verify` pins. On workflow_dispatch the `tag`
      # input supplies the ref; on `release: published` the published tag does.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "## Supply-chain run for $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Download release artifacts
        run: |
          mkdir -p release-artifacts
          gh release download "${{ steps.tag.outputs.tag }}" \
            --dir release-artifacts \
            --pattern '*' \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: ls -lh release-artifacts/

      - name: Generate SBOM for each artifact
        run: |
          cd release-artifacts
          for f in agentforge-sidecar-* agentforge-*; do
            [ -f "$f" ] || continue
            # Skip files already produced by earlier steps in a re-run.
            case "$f" in
              *.sbom.json|*.sig.bundle) continue ;;
            esac
            echo "Generating SBOM for $f"
            syft "$f" -o cyclonedx-json="${f}.sbom.json"
          done

      - name: Cosign keyless sign each artifact and SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cd release-artifacts
          for f in agentforge-sidecar-* agentforge-* *.sbom.json; do
            [ -f "$f" ] || continue
            # Don't sign existing bundles — that produces double-wrap artefacts.
            case "$f" in
              *.sig.bundle) continue ;;
            esac
            echo "Signing $f"
            cosign sign-blob --yes "$f" \
              --bundle "${f}.sig.bundle"
          done

      - name: Upload signatures and SBOMs to release
        run: |
          cd release-artifacts
          shopt -s nullglob
          bundles=(*.sig.bundle)
          sboms=(*.sbom.json)
          if [ ${#bundles[@]} -eq 0 ] && [ ${#sboms[@]} -eq 0 ]; then
            echo "No signatures or SBOMs to upload — skipping."
            exit 0
          fi
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "${bundles[@]}" "${sboms[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Artifacts signed" >> "$GITHUB_STEP_SUMMARY"
          ls release-artifacts/*.sig.bundle 2>/dev/null | while read -r f; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SBOMs generated (CycloneDX JSON)" >> "$GITHUB_STEP_SUMMARY"
          ls release-artifacts/*.sbom.json 2>/dev/null | while read -r f; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done || true

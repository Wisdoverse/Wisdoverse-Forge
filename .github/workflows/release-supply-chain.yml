# =============================================================================
# Release Supply Chain — sign artifacts + generate SBOMs
#
# Triggers: GitHub release published, workflow_dispatch (manual re-run).
# This workflow is purely additive to the main release pipeline. It runs
# after a release is published — by which point `release.yml`'s
# `release-binaries` job has already attached the cross-platform
# `agentforge-*` and `agentforge-sidecar-*` binaries to the release — and
# uploads signatures + SBOMs as additional release assets.
#
# Signing uses Sigstore keyless cosign (OIDC, no long-lived keys). The OIDC
# identity is bound to this workflow file AT THE RELEASE TAG REF, so any
# artifact signed by a fork, a different workflow, or a different tag will
# fail `agentforge verify`.
#
# IMPORTANT — workflow_dispatch identity constraint:
#   `agentforge verify` (rust/crates/cli/src/cmd/verify.rs) requires the Fulcio
#   cert subject to end with `@refs/tags/<tag>`. A workflow_dispatch run from a
#   branch would otherwise produce `@refs/heads/<branch>` and fail verification.
#   Dispatch manual runs from the release tag with a matching `tag` input.
#   Checkout does not change the workflow's OIDC identity.
#   The ref guard rejects branch runs before signing or uploading assets.
#
# SBOMs are generated in CycloneDX JSON format by syft (Anchore) and uploaded
# alongside `.sig.bundle` files. Downstream operators can run:
#
#   agentforge verify --tag v1.2.3 ./agentforge-sidecar-linux-amd64
#
# See docs/runbooks/host-cli-agent-enrollment.md for the full setup path.
# =============================================================================

name: Release Supply Chain (sign + SBOM)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # Select this tag as the workflow ref and provide the same tag input.
        description: 'Published release tag to sign (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sign-and-sbom:
    name: Sign release artifacts + generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release download/upload of signed assets + SBOMs
      id-token: write # cosign keyless (Sigstore OIDC) signing
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Validate signing ref
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::A valid published release tag is required."
            exit 1
          fi
          expected_ref="refs/tags/$RELEASE_TAG"
          expected_workflow="$GITHUB_REPOSITORY/.github/workflows/release-supply-chain.yml@$expected_ref"
          if [ "$GITHUB_REF" != "$expected_ref" ] || [ "$GITHUB_WORKFLOW_REF" != "$expected_workflow" ]; then
            echo "::error::Run this workflow from the release tag with a matching tag input."
            exit 1
          fi
          printf '## Supply-chain run for %s\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Download release artifacts
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" \
            --dir release-artifacts \
            --pattern '*' \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: ls -lh release-artifacts/

      - name: Generate SBOM for each artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          # Collect the release binaries we expect to attest. A single
          # `agentforge-*` glob already covers the `agentforge-sidecar-*`
          # binaries (they share the prefix), so there are no duplicates. Build
          # outputs from an earlier re-run (.sbom.json / .sig.bundle) are
          # excluded so a re-run never treats its own products as signable input.
          signables=()
          for f in agentforge-*; do
            case "$f" in
              *.sbom.json|*.sig.bundle) continue ;;
            esac
            [ -f "$f" ] || continue
            signables+=("$f")
          done
          # Fail closed: a release with zero matching binaries must NOT pass with
          # a green check (the #452 bug class — with no matches an unguarded
          # `for f in <glob>` iterates the literal glob string and every
          # iteration is skipped, so the job exits 0 having signed nothing).
          if [ ${#signables[@]} -eq 0 ]; then
            echo "::error::No agentforge-* release binaries found for tag $RELEASE_TAG — refusing green run with nothing signed"
            exit 1
          fi
          for f in "${signables[@]}"; do
            echo "Generating SBOM for $f"
            syft "$f" -o cyclonedx-json="${f}.sbom.json"
          done

      - name: Cosign keyless sign each artifact and SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          # Sign the release binaries plus their freshly-generated SBOMs. The
          # `agentforge-*` glob also matches `agentforge-*.sbom.json`, which the
          # `*.sbom.json` glob matches again, so dedupe by tracking seen names —
          # otherwise the same blob would be signed twice. Existing .sig.bundle
          # files are excluded so a re-run never double-wraps a signature.
          declare -A seen=()
          signables=()
          for f in agentforge-* *.sbom.json; do
            case "$f" in
              *.sig.bundle) continue ;;
            esac
            [ -f "$f" ] || continue
            [ -n "${seen[$f]:-}" ] && continue
            seen[$f]=1
            signables+=("$f")
          done
          # Fail closed: nothing to sign means the release would ship UNSIGNED
          # behind a green check. Refuse rather than pass vacuously.
          if [ ${#signables[@]} -eq 0 ]; then
            echo "::error::No agentforge-* release binaries or SBOMs found for tag $RELEASE_TAG — refusing green run with nothing signed"
            exit 1
          fi
          # Sign once per unique content digest. Platform-independent SBOMs can
          # be byte-identical across targets; signing the same digest twice in
          # one run hits Rekor's transparency-log dedupe (409 conflict) because
          # the certificate and digest match. The bundle binds to the digest,
          # not the filename, so an identical file reuses the first bundle and
          # `agentforge verify` still passes for every name.
          declare -A bundle_for_digest=()
          for f in "${signables[@]}"; do
            digest=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -n "${bundle_for_digest[$digest]:-}" ]; then
              echo "Reusing signature for $f (content identical to ${bundle_for_digest[$digest]%.sig.bundle})"
              cp "${bundle_for_digest[$digest]}" "${f}.sig.bundle"
            else
              echo "Signing $f"
              cosign sign-blob --yes "$f" \
                --bundle "${f}.sig.bundle"
              bundle_for_digest[$digest]="${f}.sig.bundle"
            fi
            cosign verify-blob --bundle "${f}.sig.bundle" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-supply-chain.yml@refs/tags/$RELEASE_TAG" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$f"
          done

      - name: Upload signatures and SBOMs to release
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          bundles=(*.sig.bundle)
          sboms=(*.sbom.json)
          # Fail closed: an empty upload set means the signing steps produced
          # nothing, so the release would ship unsigned behind a green check.
          if [ ${#bundles[@]} -eq 0 ] && [ ${#sboms[@]} -eq 0 ]; then
            echo "::error::No signatures or SBOMs to upload for tag $RELEASE_TAG — refusing green run with nothing signed"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "${bundles[@]}" "${sboms[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Artifacts signed" >> "$GITHUB_STEP_SUMMARY"
          ls release-artifacts/*.sig.bundle 2>/dev/null | while read -r f; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SBOMs generated (CycloneDX JSON)" >> "$GITHUB_STEP_SUMMARY"
          ls release-artifacts/*.sbom.json 2>/dev/null | while read -r f; do
            echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done || true

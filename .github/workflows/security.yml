# =============================================================================
# Wisdoverse Forge Scheduled Security Scan
#
# Weekly cron that catches new CVE intelligence against pinned dependencies
# without requiring a code change. Source-change-only checks
# (dangerous-patterns, secret-scan) are intentionally NOT duplicated here —
# ci.yml already runs them on every push/PR.
# =============================================================================

name: Security

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-node-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Full audit report
        run: npm audit --audit-level=moderate || true
      - name: Fail on critical/high
        run: |
          RESULT=$(npm audit --json 2>/dev/null || echo '{}')
          CRITICAL=$(echo "$RESULT" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).metadata?.vulnerabilities?.critical||0}catch{0}")
          HIGH=$(echo "$RESULT" | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).metadata?.vulnerabilities?.high||0}catch{0}")
          echo "Vulnerabilities — critical: $CRITICAL, high: $HIGH"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            exit 1
          fi

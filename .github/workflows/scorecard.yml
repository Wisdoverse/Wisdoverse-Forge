# =============================================================================
# OpenSSF Scorecard
# =============================================================================
# Industry-standard supply-chain hygiene scoring. Runs weekly + on pushes to
# `main` and posts findings to the Security tab as SARIF. The score itself is
# also published to the OpenSSF API; the project README can render the badge
# linked from the workflow.
#
# Scope: read-only audit — never blocks a merge, just visibility. Treat low
# scores as a follow-up backlog rather than a CI gate.
#
# Reference: https://github.com/ossf/scorecard-action
# =============================================================================

name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard

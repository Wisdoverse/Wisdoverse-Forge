# =============================================================================
# OpenSSF Scorecard
# =============================================================================
# Industry-standard supply-chain hygiene scoring. Runs weekly + on pushes to
# `main` and posts findings to the Security tab as SARIF. The score itself is
# also published to the OpenSSF API; the project README can render the badge
# linked from the workflow.
#
# Scope: read-only audit — never blocks a merge, just visibility. Treat low
# scores as a follow-up backlog rather than a CI gate.
#
# Reference: https://github.com/ossf/scorecard-action
# =============================================================================

name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard

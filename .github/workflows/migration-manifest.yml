name: Migration Manifest

# Runs whenever a PR touches a migration file. Regenerates the SHA-256 manifest
# from the committed *.sql files and fails if it differs from MANIFEST.sha256.
#
# To fix a failing check locally:
#   cd rust/crates/db/migrations
#   sha256sum *.sql > MANIFEST.sha256
#   git add MANIFEST.sha256 && git commit -m "chore(db): update migration manifest"

on:
  pull_request:
    paths:
      - 'rust/crates/db/migrations/**'

jobs:
  verify:
    name: Verify MANIFEST.sha256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and compare manifest
        run: |
          cd rust/crates/db/migrations
          sha256sum *.sql | sort > /tmp/manifest.computed
          sort MANIFEST.sha256 > /tmp/manifest.committed
          if ! diff -u /tmp/manifest.committed /tmp/manifest.computed; then
            echo "::error file=rust/crates/db/migrations/MANIFEST.sha256::MANIFEST.sha256 does not match migrations/*.sql contents"
            echo "::error::Run: cd rust/crates/db/migrations && sha256sum *.sql > MANIFEST.sha256"
            exit 1
          fi
          echo "MANIFEST.sha256 is up to date."

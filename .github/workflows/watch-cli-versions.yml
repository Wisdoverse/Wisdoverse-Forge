# =============================================================================
# Watch CLI Versions
#
# Detects when an upstream agent CLI (opencode, codex, gemini) publishes a
# new npm version and rebuilds the matching agent overlay image on GHCR
# with that version pinned.
#
# Scope (intentionally narrow): only the redistributable CLI overlays.
# `agent-base`, `server`, `orchestrator`, `sidecar`, and the
# frontend image are rebuilt by `publish-images.yml` on every push to
# `main`. Claude is built locally by operators (license precludes a public
# GHCR image).
#
# How it works:
#   1. Every 6 hours, `npm view <package> version` reports the latest
#      published version for each CLI.
#   2. The job resolves and verifies the signed `agent-base:main` digest.
#   3. The job reads the existing `:latest` GHCR image's version/base labels
#      and verifies its main-branch workflow signature.
#   4. If the versions/base differ, the labels are missing, or the image is
#      unsigned/untrusted, the job builds a new agent overlay against the
#      immutable verified base digest and pushes
#      it under three tags:
#        - `:<cli-version>`        CLI-version alias (may move on base rebuild)
#        - `:latest`               always points at the freshest CLI bump
#        - `:edge`                 alias for `:latest`
#
# Cron cadence (6h) and `concurrency:` group are tuned for the GitHub
# Actions free-tier minutes budget and to stay clear of the abuse-
# detection heuristics that pause aggressively-scheduled workflows.
# Operators on a private fork who want faster drift detection can either
# raise the cron frequency or invoke the workflow on demand via
# `gh workflow run "Watch CLI Versions"`.
#
# Stays inside the same GitHub-side single-source-of-truth as PR #4 and
# the GitLab CI cleanup in MR #696. Operators tracking the OSS workflow
# never need to wire up a npm version watcher themselves.
# =============================================================================

name: Watch CLI Versions

on:
  schedule:
    # Every 6 hours. Reduced from 30 min to stay well under GitHub Actions
    # free-tier minutes for private forks and to avoid the abuse-detection
    # heuristics that can pause aggressively-scheduled workflows. CLI
    # publishers (opencode-ai, @openai/codex, @google/gemini-cli) publish
    # at most a few times per week in practice, so 6h drift detection is
    # plenty for OSS operators tracking `agent-<tool>:latest`.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Only one drift-detection run at a time, even if a build runs long. Lets
# in-flight builds finish before the next scheduled tick rather than
# stacking jobs.
concurrency:
  group: watch-cli-versions
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io

jobs:
  require-main:
    name: Require trusted main ref
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main publication
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Trusted CLI images can only be published from refs/heads/main; selected ref was $GITHUB_REF."
            exit 1
          fi

  detect-and-rebuild:
    name: agent-${{ matrix.tool }}
    needs: require-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: opencode
            package: opencode-ai
          - tool: codex
            package: '@openai/codex'
          - tool: gemini
            package: '@google/gemini-cli'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: cli
        name: Resolve and validate redistributable CLI package
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          VERSION="$(npm view "$PACKAGE_NAME" version)"
          LICENSE="$(npm view "$PACKAGE_NAME" license || true)"
          case "$LICENSE" in
            MIT|Apache-2.0|BSD-2-Clause|BSD-3-Clause|ISC|MPL-2.0|"MIT OR Apache-2.0"|"Apache-2.0 OR MIT")
              ;;
            *)
              echo "::error::Package $PACKAGE_NAME has non-allowlisted license '$LICENSE'; refusing to publish public image"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "license=$LICENSE" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: base
        name: Resolve and verify immutable agent-base input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-base"

          echo "$GH_TOKEN" | crane auth login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin
          if ! BASE_DIGEST="$(crane digest "$BASE_IMAGE:main")"; then
            echo "::error::agent-base:main is unavailable; run Publish Images from main before rebuilding CLI overlays."
            exit 1
          fi
          if ! cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$BASE_IMAGE@$BASE_DIGEST" >/dev/null; then
            echo "::error::agent-base:main lacks the trusted Publish Images signature; refusing to build an overlay from it."
            exit 1
          fi

          echo "ref=$BASE_IMAGE@$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"

      - id: drift
        name: Compare upstream version, base digest, and image trust
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}"
          LATEST="${{ steps.cli.outputs.version }}"

          if ! IMAGE_DIGEST=$(crane digest "$IMAGE:latest" 2>/dev/null); then
            echo "no :latest image yet; will build $LATEST"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! CONFIG=$(crane config "$IMAGE@$IMAGE_DIGEST" 2>/dev/null); then
            echo "could not read the resolved :latest digest; will rebuild $LATEST"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(printf '%s' "$CONFIG" | jq -r '.config.Labels["org.wisdoverse.cli-version"] // empty')
          CURRENT_BASE=$(printf '%s' "$CONFIG" | jq -r '.config.Labels["org.wisdoverse.agent-base-digest"] // empty')
          if [ -z "$CURRENT" ]; then
            echo "image lacks cli-version label; will build $LATEST"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$CURRENT" != "$LATEST" ]; then
            echo "version drift: image=$CURRENT npm=$LATEST"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$CURRENT_BASE" != "${{ steps.base.outputs.digest }}" ]; then
            echo "base drift: image=${CURRENT_BASE:-missing} trusted=${{ steps.base.outputs.digest }}"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TRUSTED=false
          for WORKFLOW in publish-images.yml watch-cli-versions.yml release.yml; do
            if cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/$WORKFLOW@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$IMAGE@$IMAGE_DIGEST" >/dev/null 2>&1; then
              TRUSTED=true
              break
            fi
          done

          if [ "$TRUSTED" != "true" ]; then
            echo "current image is unsigned or lacks a trusted main-branch workflow signature; will rebuild $LATEST"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "already current and trusted at $CURRENT ($IMAGE_DIGEST)"
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.drift.outputs.needs_rebuild == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: steps.drift.outputs.needs_rebuild == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.drift.outputs.needs_rebuild == 'true'
        id: agent-cli-build
        name: Build + push agent-${{ matrix.tool }} pinned to npm latest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}:${{ steps.cli.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}:edge
          sbom: true
          provenance: true
          labels: |
            org.opencontainers.image.licenses=${{ steps.cli.outputs.license }}
            org.wisdoverse.cli-version=${{ steps.cli.outputs.version }}
            org.wisdoverse.upstream-package=${{ matrix.package }}
            org.wisdoverse.rebuild-trigger=watch-cli-versions
            org.wisdoverse.agent-base-digest=${{ steps.base.outputs.digest }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            CLI_TOOL=${{ matrix.tool }}
            CLI_VERSION=${{ steps.cli.outputs.version }}
          cache-from: type=gha,scope=agent-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.tool }}

      - if: steps.drift.outputs.needs_rebuild == 'true'
        name: Sign agent-${{ matrix.tool }} image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}
          DIGEST: ${{ steps.agent-cli-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - if: steps.drift.outputs.needs_rebuild == 'true'
        name: Summarise rebuild
        run: |
          echo "## agent-${{ matrix.tool }} updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- package: \`${{ matrix.package }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- new version: \`${{ steps.cli.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pushed: \`:${{ steps.cli.outputs.version }}\`, \`:latest\`, \`:edge\`" >> "$GITHUB_STEP_SUMMARY"

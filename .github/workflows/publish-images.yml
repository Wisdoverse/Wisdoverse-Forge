# =============================================================================
# Publish container images to GitHub Container Registry
#
# Triggers
#   - Push to main:        publishes :main, :sha-<short>, :edge
#                          (`agent-base` also gets :sha-<full> for releases)
#   - workflow_dispatch:   rebuilds the selected main commit only
#
# Images published (under ghcr.io/${{ github.repository }})
#   - frontend (root namespace, e.g. ghcr.io/wisdoverse/wisdoverse-forge:main)
#   - server, orchestrator, sidecar
#   - agent-base
#   - agent-{opencode,codex,gemini}
#
# Claude Code is intentionally not published in public images because its
# package license points to Anthropic terms rather than a standard
# open-source redistribution license. Operators can build it locally with
# `make build-agent-all` or push it to a private registry whose terms permit it.
#
# OSS operators consume these via scripts/deploy.sh:
#   AGENT_REGISTRY=ghcr.io/wisdoverse/wisdoverse-forge bash scripts/deploy.sh staging main "ghcr.io/wisdoverse/wisdoverse-forge"
# =============================================================================

# -----------------------------------------------------------------------------
# Supply-chain hardening (issue #459)
#
# Every published image is signed with Sigstore KEYLESS cosign (OIDC, no
# long-lived keys) BY DIGEST, never by mutable tag — signing a tag is a known
# anti-pattern because the tag can later be repointed at a different digest.
# `docker/build-push-action` exposes the pushed manifest digest as
# `steps.<id>.outputs.digest`; we sign `<image-name>@<digest>`.
#
# The cosign Fulcio OIDC identity is bound to THIS workflow file
# (`publish-images.yml`) on `refs/heads/main`, so `agentforge verify-image` can
# pin the expected signer and fail closed on an unexpected identity rather
# than trusting "any Sigstore signature". See
# rust/crates/cli/src/cmd/verify_image.rs and
# docs/runbooks/host-cli-agent-enrollment.md.
#
# Each signed image also gets a SLSA build-provenance attestation
# (actions/attest-build-provenance) keyed to the same digest — GitHub's native
# SLSA path, verifiable with `gh attestation verify` or cosign.
# -----------------------------------------------------------------------------

name: Publish Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io

jobs:
  require-main:
    name: Require trusted main ref
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main publication
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Trusted images can only be published from refs/heads/main; selected ref was $GITHUB_REF."
            exit 1
          fi

  publish-frontend:
    name: Publish frontend + Rust images
    needs: require-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      # Required for actions/attest-build-provenance to write the SLSA
      # provenance attestation to the GitHub attestations API.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sigstore keyless signer for the per-image cosign sign steps below.
      # SHA pinned to the same release as release-supply-chain.yml.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # ---- frontend ---------------------------------------------------------
      - id: frontend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=edge
      - id: frontend-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Sign frontend image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.frontend-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest frontend build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.frontend-build.outputs.digest }}
          push-to-registry: true

      # ---- server ------------------------------------------------------
      - id: server-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/server
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=edge
      - id: server-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./rust
          file: ./rust/Dockerfile
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Sign server image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/server
          DIGEST: ${{ steps.server-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest server build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/server
          subject-digest: ${{ steps.server-build.outputs.digest }}
          push-to-registry: true

      # ---- sidecar -----------------------------------------------------
      - id: sidecar-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/sidecar
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=edge
      - id: sidecar-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./rust
          file: ./rust/Dockerfile.sidecar
          push: true
          tags: ${{ steps.sidecar-meta.outputs.tags }}
          labels: ${{ steps.sidecar-meta.outputs.labels }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
      # Security-critical: the sidecar is the container-runtime trust anchor.
      - name: Sign sidecar image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/sidecar
          DIGEST: ${{ steps.sidecar-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest sidecar build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/sidecar
          subject-digest: ${{ steps.sidecar-build.outputs.digest }}
          push-to-registry: true

      # ---- orchestrator -----------------------------------------------
      - id: orchestrator-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/orchestrator
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=edge
      - id: orchestrator-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./rust
          file: ./rust/Dockerfile.orchestrator
          push: true
          tags: ${{ steps.orchestrator-meta.outputs.tags }}
          labels: ${{ steps.orchestrator-meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
      - name: Sign orchestrator image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/orchestrator
          DIGEST: ${{ steps.orchestrator-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest orchestrator build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/orchestrator
          subject-digest: ${{ steps.orchestrator-build.outputs.digest }}
          push-to-registry: true

  publish-agent-base:
    name: Publish agent-base
    needs: require-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.agent-base-build.outputs.digest }}
    # No `attestations: write`: agent-base relies on buildx `provenance: true`
    # (written to the registry via `packages: write`) plus the cosign signature
    # below, not actions/attest-build-provenance.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-base
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=edge
      - id: agent-base-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile.agent-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx already attaches an in-toto SLSA provenance + SBOM
          # attestation to the image manifest, so we add the cosign signature
          # here rather than a duplicate actions/attest-build-provenance run.
          sbom: true
          provenance: true
          cache-from: type=gha,scope=agent-base
          cache-to: type=gha,mode=max,scope=agent-base
      - name: Sign agent-base image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-base
          DIGEST: ${{ steps.agent-base-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish-agent-cli-images:
    name: Publish agent-${{ matrix.tool }}
    needs: publish-agent-base
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: opencode
            package: opencode-ai
          - tool: codex
            package: '@openai/codex'
          - tool: gemini
            package: '@google/gemini-cli'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: cli
        name: Resolve and validate redistributable CLI package
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          VERSION="$(npm view "$PACKAGE_NAME" version)"
          LICENSE="$(npm view "$PACKAGE_NAME" license || true)"
          case "$LICENSE" in
            MIT|Apache-2.0|BSD-2-Clause|BSD-3-Clause|ISC|MPL-2.0|"MIT OR Apache-2.0"|"Apache-2.0 OR MIT")
              ;;
            *)
              echo "::error::Package $PACKAGE_NAME has non-allowlisted license '$LICENSE'; refusing to publish public image"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "license=$LICENSE" >> "$GITHUB_OUTPUT"

      - id: refs
        name: Resolve image refs
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:${{ steps.cli.outputs.version }}"
            echo "$IMAGE:sha-$SHA_SHORT"
            echo "$IMAGE:main"
            echo "$IMAGE:edge"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify immutable agent-base input
        env:
          BASE_IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-base@${{ needs.publish-agent-base.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-images.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$BASE_IMAGE" >/dev/null

      - id: agent-cli-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          # buildx already attaches an in-toto SLSA provenance + SBOM
          # attestation to the image manifest; cosign adds the keyless signature.
          sbom: true
          provenance: true
          labels: |
            org.opencontainers.image.licenses=${{ steps.cli.outputs.license }}
            org.wisdoverse.cli-version=${{ steps.cli.outputs.version }}
            org.wisdoverse.agent-base-digest=${{ needs.publish-agent-base.outputs.digest }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-base@${{ needs.publish-agent-base.outputs.digest }}
            CLI_TOOL=${{ matrix.tool }}
            CLI_VERSION=${{ steps.cli.outputs.version }}
          cache-from: type=gha,scope=agent-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.tool }}
      - name: Sign agent-${{ matrix.tool }} image by digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/agent-${{ matrix.tool }}
          DIGEST: ${{ steps.agent-cli-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

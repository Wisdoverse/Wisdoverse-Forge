# NATS JetStream configuration for Wisdoverse Forge.
# Ref: https://docs.nats.io/running-a-nats-service/configuration
#
# Issue #38 phase 2: the shared `agent` user from phase 1 is removed. Every
# spawned sidecar now connects with its own `(agent_uuid, nats_connect_password)`
# pair — validated by the auth callout service embedded in the Rust API — and
# receives a short-lived (15 min) User JWT whose publish/subscribe allowlists
# are scoped to that agent's own UUID.
#
# The callout flow in one pass:
#   1. Sidecar CONNECTs to this NATS server with user=<agent_uuid>,
#      pass=<nats_connect_password>.
#   2. NATS XKey-encrypts the connect claim under the `authorization.auth_callout.xkey`
#      public key below and publishes it on `$SYS.REQ.USER.AUTH` inside the
#      AUTH account.
#   3. The API's `AuthCalloutWorker` (AUTH-account `auth_service` user) receives,
#      decrypts, validates password against `agents.nats_connect_password`, and
#      returns a signed User JWT whose `nats.pub/allow` and `nats.sub/allow`
#      only mention the caller's own `<agent_uuid>` in every subject segment.
#   4. NATS binds those per-UUID permissions to the connection.
#
# Cross-agent spoofing (the leftover gap from phase 1) is now structurally
# impossible at the NATS layer — not relying on sidecar HMAC (issue #39)
# alone.
#
# NATS server version 2.12+ is required for the `auth_callout` block below.

server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http_port: 8222

# 64MB max payload — required for Docker build context tarballs (up to 50MB raw,
# ~67MB after JSON+base64 encoding in DockerProxyRequest).
# TECH DEBT: Phase 2 will migrate build contexts to MinIO and reduce to 1MB.
max_payload: 67108864

# Connection limits — prevent connection exhaustion (baseline ~30 with sidecars).
max_connections: 256

# Slow consumer protection — disconnect clients that can't keep up.
write_deadline: "10s"

jetstream {
  store_dir: /data
  max_mem: 128MB
  max_file: 2GB
}

# Three-account split:
#   - AGENTFORGE: workload traffic. Backend is unrestricted; per-agent users
#     are minted dynamically by the callout service and inherit subject perms
#     from the User JWT.
#   - AUTH: houses the `auth_service` user the callout process connects as.
#     Listed in `auth_callout.auth_users` so its own CONNECT bypasses the
#     callout (otherwise a deadlock — the callout would be called to
#     authenticate the callout itself).
#   - SYS: system namespace for `$SYS.>` monitoring + connection KICK.
accounts {
  AGENTFORGE: {
    jetstream: enabled
    # NOTE (issue #55): do NOT add `signing_keys` here. That field is only
    # valid in operator / JWT-resolver mode — server-config `accounts`
    # blocks reject it ("unknown field signing_keys"). In server-config
    # mode NATS maps callout-minted users onto this account by matching
    # the inner User JWT's `aud` claim (set to the string "AGENTFORGE"
    # on the API side) against the account NAME via
    # `s.LookupAccount(aud)`. The inner JWT is still signed by
    # `NATS_CALLOUT__ACCOUNT_SIGNING_KEY_SEED`, but that key material
    # never appears here — the outer AuthorizationResponse signature
    # (matched against `authorization.auth_callout.issuer` below) is
    # the sole trust anchor.
    users: [
      # Backend user: full permissions inside the account. Consumed by the
      # Rust API + jobs binaries. Bypasses callout (listed in auth_users).
      {
        user: backend
        password: $NATS_BACKEND_PASSWORD
      }
    ]
    # No static `agent` user. Agents authenticate via callout.
  }

  AUTH: {
    users: [
      # Callout service user. Bypasses auth_callout (listed in auth_users)
      # so the API's own NATS connection is not routed through the callout
      # it serves. Permissions are implicit: AUTH account cannot touch
      # `broadcast.>` or any AGENTFORGE subject by account boundary.
      {
        user: auth_service
        password: $NATS_AUTH_SERVICE_PASSWORD
      }
    ]
  }

  SYS: {
    users: [
      {
        user: sys
        password: $NATS_SYS_PASSWORD
      }
    ]
  }
}
system_account: SYS

authorization {
  auth_callout {
    # Public half of the API's NATS_CALLOUT__ISSUER_SEED. The callout signs
    # outer AuthorizationResponse JWTs with the corresponding private seed;
    # NATS verifies them with this public key.
    issuer: $NATS_CALLOUT_ISSUER_PUBLIC

    # Which account houses the users permitted to serve the callout.
    account: AUTH

    # Users that BYPASS the callout. Required for the callout service itself
    # (would deadlock otherwise), plus the `backend` user (would otherwise
    # break every backend NATS connection, including the callout subscriber).
    # `sys` is included so monitoring tools keep working during callout
    # outages. No sidecar user is listed — every agent goes through callout.
    auth_users: [ auth_service, backend, sys ]

    # Public half of the API's NATS_CALLOUT__XKEY_SEED. Server uses this
    # public key to encrypt the callout request (carrying the plaintext
    # password); the API decrypts with the private seed. When absent the
    # callout runs in plaintext mode — acceptable only in dev overrides.
    xkey: $NATS_CALLOUT_XKEY_PUBLIC
  }
}

logfile_size_limit: 50MB

# =============================================================================
# Wisdoverse Forge - Development Override
# =============================================================================
#
# Thin overlay for dev-specific settings (Rust app runtime, local DB/Redis).
# Always used together with compose.yml + --profile dev:
#
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml --profile dev up --build
#   # Or: make dev
#
# =============================================================================

services:
  agentforge-server:
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${AGENTFORGE_PORT:-4003}:4003'

    environment:
      - NODE_ENV=development
      - ENVIRONMENT=development
      - ALLOW_UNPROTECTED_ADMIN_BOOTSTRAP=true
      - LOG_LEVEL=debug
      - DATABASE_URL=postgres://agentforge:${POSTGRES_PASSWORD:-devpassword}@db:5432/agentforge
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - AUTH_SSO__ENABLED=${AUTH_SSO__ENABLED:-false}
      - AUTH_SSO__OIDC_DISCOVERY_URL=${AUTH_SSO__OIDC_DISCOVERY_URL:-}
      - AUTH_SSO__OIDC_CLIENT_ID=${AUTH_SSO__OIDC_CLIENT_ID:-}
      - AUTH_SSO__OIDC_CLIENT_SECRET=${AUTH_SSO__OIDC_CLIENT_SECRET:-}
      - AUTH_SSO__OIDC_SCOPES=${AUTH_SSO__OIDC_SCOPES:-}
      - AUTH_SSO__DISPLAY_NAME=${AUTH_SSO__DISPLAY_NAME:-}
      - AUTH_SSO__SPA_BASE_URL=${AUTH_SSO__SPA_BASE_URL:-}
      - AUTH_SSO__ROLE_CLAIM=${AUTH_SSO__ROLE_CLAIM:-}
      - AUTH_SSO__ADMIN_GROUPS=${AUTH_SSO__ADMIN_GROUPS:-}
      - AUTH_SSO__ORG_GROUP_MAP=${AUTH_SSO__ORG_GROUP_MAP:-}
      - AUTH_SSO__DEPROVISION=${AUTH_SSO__DEPROVISION:-false}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Orchestrator dev dependencies
  orchestrator:
    depends_on:
      orchestrator-db:
        condition: service_healthy
      temporal:
        condition: service_started

# =============================================================================
# Wisdoverse Forge - Production Override (Self-Contained DB + Redis)
# =============================================================================
#
# Thin overlay that points the default Rust backend to the compose-internal db
# and redis services started by the 'prod' profile. Not needed for 'external'
# profile.
#
#   docker compose -f docker/compose.yml -f docker/compose.prod.yml --profile prod up -d --build
#   # Or: make prod
#
# =============================================================================

services:
  agentforge-server:
    environment:
      - DATABASE_URL=postgres://agentforge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@db:5432/agentforge
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}@redis:6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  temporal:
    healthcheck:
      test:
        [
          'CMD',
          'temporal',
          'operator',
          'namespace',
          'describe',
          'default',
          '--address',
          'temporal-internal:7233',
        ]

  orchestrator:
    environment:
      - ORCHESTRATOR_DATABASE_URL=postgres://orchestrator:${ORCHESTRATOR_DB_PASSWORD:?ORCHESTRATOR_DB_PASSWORD is required in production (existing installs - see docs/runbooks/self-host-ops.md)}@orchestrator-db:5432/orchestrator?sslmode=disable
      # Workflow execution reconciler (#1352), repeated so this override keeps it.
      - ORCHESTRATOR_WORKFLOW_RECONCILE_ENABLED=${ORCHESTRATOR_WORKFLOW_RECONCILE_ENABLED:-true}
      - ORCHESTRATOR_WORKFLOW_RECONCILE_GRACE_SECS=${ORCHESTRATOR_WORKFLOW_RECONCILE_GRACE_SECS:-600}
      - ORCHESTRATOR_WORKFLOW_RECONCILE_TRUST_CURRENT_TEMPORAL=${ORCHESTRATOR_WORKFLOW_RECONCILE_TRUST_CURRENT_TEMPORAL:-false}
    depends_on:
      temporal:
        condition: service_healthy

  orchestrator-db:
    environment:
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?ORCHESTRATOR_DB_PASSWORD is required in production (existing installs - see docs/runbooks/self-host-ops.md)}

  backup:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?ORCHESTRATOR_DB_PASSWORD is required in production (existing installs - see docs/runbooks/self-host-ops.md)}
    depends_on:
      db:
        condition: service_healthy
      orchestrator-db:
        condition: service_healthy

# =============================================================================
# Wisdoverse Forge — Prometheus alert rules (template)
# =============================================================================
# Drop-in alert rules covering the SLOs the platform should defend in
# production. Import via your Prometheus / Alertmanager stack:
#
#   prometheus.yml
#     rule_files:
#       - /etc/prometheus/agentforge/alerts.yml
#
# Routes / receivers (PagerDuty, Slack, email) live in your Alertmanager
# config — this file describes WHAT to alert on, not WHO to page. Adjust
# severities and thresholds for your error budget. The API objective requires
# more than 99.5% request availability over a complete 30-day window.
# Fast alerts use shorter windows for incident response.
#
# Metric names / labels match what the Rust API actually emits (see
# rust/crates/api/src/observability/http_metrics.rs and the orchestration
# metrics). `scripts/check-metrics-contract.mjs` fails CI if any rule below
# references a series the code never emits:
#   * `http_requests_total{method, path, status}` — request counter
#   * `http_request_duration_seconds_bucket{le, method, path}` — latency histogram
#   * `agentforge_orchestration_outbox_oldest_age_seconds` — orchestrator backlog age
#   * `agentforge_orchestration_outbox_backlog` — orchestrator publish backlog depth
#   * `credential_refresh_errors_total{cli_tool, reason}` — CLI auth proxy refresh errors
#   * `agentforge_self_fix_pr_total{outcome}` — self-fix PR Bridge open outcomes
#   * `agentforge_self_fix_merge_total{outcome}` — self-fix Merge Executor outcomes
#   * `process_resident_memory_bytes` — external; the Forge services do not emit it,
#     so APIMemoryHigh needs a process exporter (see EXTERNAL_METRICS in the check)
#
# Service discrimination (CN-5): the orchestrator emits the SAME HTTP metric
# names as the API, tagged `service="orchestrator"`; the API emits no `service`
# label. The `agentforge.api.*` groups therefore scope to `service!="orchestrator"`
# so orchestrator traffic never counts toward the API error budget, and the
# `agentforge.orchestrator.http` group scopes to `service="orchestrator"`.
# (The `agentforge.agents-runtime` rules in agents-runtime.yml filter by
# API-exclusive `/api/v1/agents*` paths the orchestrator never serves, so they
# need no service filter.)
# =============================================================================

groups:
  - name: agentforge.api.availability
    # status!="501": a deliberate Not Implemented reply is not an outage of implemented service; excluded from both sides.
    # APINotImplementedResponses watches those excluded 501s so a route regressing to 501 is not invisible.
    rules:
      - alert: API5xxRatioAtOrAboveSLO
        expr: |
          (
            (
              sum(rate(http_requests_total{status=~"5..",service!="orchestrator",status!="501"}[30d]))
              or vector(0)
            )
            /
            sum(rate(http_requests_total{service!="orchestrator",status!="501"}[30d]))
          ) >= 0.005
          and
          sum(rate(http_requests_total{service!="orchestrator",status!="501"}[30d])) > 0
        for: 1h
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: 'Observed API 5xx at least 0.5% (30-day lookback)'
          description: 'Observed ratio is {{ $value | humanizePercentage }}. Acceptance requires complete scrape coverage.'
          runbook: 'docs/runbooks/observability-slo.md#api-availability'

      - alert: APIHigh5xxRate
        expr: |
          (
            sum by (path) (rate(http_requests_total{status=~"5..",service!="orchestrator",status!="501"}[5m]))
            /
            sum by (path) (rate(http_requests_total{service!="orchestrator",status!="501"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: '5xx rate >1% on {{ $labels.path }} for 5m'
          runbook: 'docs/runbooks/observability-slo.md#api-availability'

      - alert: APIErrorBudgetBurn
        # A 1.4% error ratio burns the 0.5% error budget at 2.8 times its target rate.
        expr: |
          (
            sum(rate(http_requests_total{status=~"5..",service!="orchestrator",status!="501"}[1h]))
            /
            sum(rate(http_requests_total{service!="orchestrator",status!="501"}[1h]))
          ) > 0.014
          and
          (
            sum(rate(http_requests_total{status=~"5..",service!="orchestrator",status!="501"}[5m]))
            /
            sum(rate(http_requests_total{service!="orchestrator",status!="501"}[5m]))
          ) > 0.014
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: 'Error budget burn 2.8× over 1h+5m windows'
          runbook: 'docs/runbooks/observability-slo.md#api-availability'

      - alert: APINotImplementedResponses
        # The second branch catches a route's first 501: a new counter series has no earlier sample for increase().
        expr: |
          sum by (path) (increase(http_requests_total{status="501",service!="orchestrator"}[15m])) > 0
          or
          sum by (path) (
            http_requests_total{status="501",service!="orchestrator"}
            unless
            http_requests_total{status="501",service!="orchestrator"} offset 15m
          )
        for: 0m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: 'API answered 501 Not Implemented on {{ $labels.path }} in the last 15m'
          description: 'A call to a deprecated stub endpoint, or a regression of an implemented route. 501s are excluded from the availability ratio.'
          runbook: 'docs/runbooks/observability-slo.md#not-implemented-responses'

  - name: agentforge.api.latency
    rules:
      - alert: APILatencyHighP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, path) (rate(http_request_duration_seconds_bucket{service!="orchestrator"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: 'p95 latency >1s on {{ $labels.path }} for 10m'

      - alert: APILatencyHighP99
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, path) (rate(http_request_duration_seconds_bucket{service!="orchestrator"}[5m]))
          ) > 3
        for: 10m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: 'p99 latency >3s on {{ $labels.path }} for 10m'

  - name: agentforge.orchestrator.http
    # CN-5: the orchestrator emits the same HTTP metric names as the API,
    # tagged `service="orchestrator"`. These rules watch the coordinator's own
    # request error rate + latency, scoped to that label so they never overlap
    # the `agentforge.api.*` budget above.
    rules:
      - alert: OrchestratorHigh5xxRate
        expr: |
          (
            sum by (path) (rate(http_requests_total{status=~"5..",service="orchestrator"}[5m]))
            /
            sum by (path) (rate(http_requests_total{service="orchestrator"}[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: 'Orchestrator 5xx rate >1% on {{ $labels.path }} for 5m'
          runbook: 'docs/runbooks/runtime-validation.md'

      - alert: OrchestratorLatencyHighP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, path) (rate(http_request_duration_seconds_bucket{service="orchestrator"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: 'Orchestrator p95 latency >1s on {{ $labels.path }} for 10m'

  - name: agentforge.orchestration
    rules:
      - alert: OrchestrationLagHigh
        expr: agentforge_orchestration_outbox_oldest_age_seconds > 60
        for: 5m
        labels:
          severity: page
          slo: orchestration
        annotations:
          summary: 'Orchestrator outbox oldest-unpublished age >60s for 5m'
          runbook: 'docs/runbooks/orchestration.md'

      - alert: OrchestrationOutboxBacklogHigh
        expr: agentforge_orchestration_outbox_backlog > 1000
        for: 10m
        labels:
          severity: ticket
          slo: orchestration
        annotations:
          summary: 'Orchestrator outbox backlog >1000 unpublished for 10m'
          runbook: 'docs/runbooks/orchestration.md'

  - name: agentforge.deploy
    rules:
      # External: needs a Docker exporter publishing container_restart_count; Forge does not ship one, so without it this never fires.
      - alert: ContainerRestartLoop
        # Not a cAdvisor or kube-state-metrics name. For raw docker, derive from the
        # health-check exit code or container_start_time_seconds delta.
        expr: |
          increase(container_restart_count{name=~"agentforge-(server|orchestrator)"}[10m]) > 3
        for: 0m
        labels:
          severity: page
          slo: deploy
        annotations:
          summary: '{{ $labels.name }} restarted >3× in 10m'

      # External: needs the blackbox exporter and a `staging-health` scrape job; Forge ships neither, so without them this never fires.
      - alert: HealthCheckFailing
        # Match any blackbox probe target whose Prometheus job label is `staging-health`.
        # The actual staging hostname lives in the Prometheus scrape config (not in this
        # public file) so the URL doesn't leak via GitHub Code Search.
        expr: probe_success{job="staging-health"} == 0
        for: 3m
        labels:
          severity: page
          slo: deploy
        annotations:
          summary: 'Staging /api/health failing for 3m'

  - name: agentforge.resource
    rules:
      # External: needs cAdvisor (machine_memory_bytes) and a process exporter for job agentforge-server; Forge ships neither, so without them this never fires.
      - alert: APIMemoryHigh
        expr: |
          process_resident_memory_bytes{job="agentforge-server"}
          /
          on() group_left() (machine_memory_bytes)
          > 0.8
        for: 15m
        labels:
          severity: ticket
          slo: resource
        annotations:
          summary: 'agentforge-server memory >80% for 15m'

  - name: agentforge.credentials
    rules:
      - alert: CliAuthProxyInvalidClientFailures
        expr: |
          sum by (cli_tool) (
            increase(credential_refresh_errors_total{reason="invalid_client"}[10m])
          ) > 0
        for: 1m
        labels:
          severity: critical
          component: cli-auth-proxy
        annotations:
          summary: 'CLI auth proxy OAuth app rejected for {{ $labels.cli_tool }}'
          description: 'The OAuth provider rejected the configured client_id/client_secret. This is an operator-owned invalid_client failure, not a user credential problem.'
          runbook: 'docs/runbooks/credential-sync.md#cli-auth-proxy-invalid-client'

  - name: agentforge.self-fix
    rules:
      - alert: SelfFixPrPermanentFailure
        # The PR Bridge drops the job without retry on this outcome, so the
        # self-fix task never gets a pull request until an operator acts.
        expr: increase(agentforge_self_fix_pr_total{outcome="permanent_failed"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          slo: self-fix
        annotations:
          summary: 'Self-fix PR open failed permanently (no retry)'
          description: '{{ $value | humanize }} self-fix PR open attempt(s) failed permanently in 15m. The job was dropped; no pull request was opened.'
          runbook: 'docs/runbooks/observability-slo.md#self-fix-delivery'

      - alert: SelfFixMergeFailed
        # `failed` is the Merge Executor's catch-all error outcome (GitHub API
        # I/O or an unexpected gate error); gate refusals have their own labels.
        # The executor merges before posting the audit comment, so a comment
        # error also lands here after a successful merge.
        expr: increase(agentforge_self_fix_merge_total{outcome="failed"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          slo: self-fix
        annotations:
          summary: 'Self-fix merge attempt did not complete cleanly'
          description: '{{ $value | humanize }} approved self-fix merge attempt(s) did not complete cleanly in 15m. The merge may already have happened; check the PR state on GitHub.'
          runbook: 'docs/runbooks/observability-slo.md#self-fix-delivery'

      - alert: SelfFixMergeAttemptsExhausted
        # Recorded when an approve call finds merge_attempts at the cap; the
        # task is set to changes_requested and every later approve is refused.
        expr: increase(agentforge_self_fix_merge_total{outcome="exhausted"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          slo: self-fix
        annotations:
          summary: 'Self-fix merge attempt cap reached'
          description: '{{ $value | humanize }} self-fix approve call(s) hit the merge attempt cap in 15m. In-app merge is refused for the task; finish the change on GitHub.'
          runbook: 'docs/runbooks/observability-slo.md#self-fix-delivery'

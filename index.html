<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deploy, orchestrate, and monitor AI coding agents across any LLM provider. Multi-runtime support, intelligent routing, real-time visualization."
    />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Wisdoverse Forge &mdash; AI Agent Management Platform</title>

    <!--
      Pre-paint theme bootstrap. Runs synchronously before first paint to
      avoid a flash of the wrong theme. Reads the same localStorage key
      ThemeProvider uses, then falls back to prefers-color-scheme.
    -->
    <script>
      (function () {
        try {
          var STORAGE_KEY = 'agentforge-theme';
          var stored = window.localStorage.getItem(STORAGE_KEY);
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#f5f5f7');
          }
        } catch (_e) {
          /* storage blocked or matchMedia missing; CSS defaults take over */
        }
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wisdoverse Forge" />

    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://wisdoverse.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wisdoverse Forge — AI Agent Management Platform" />
    <meta
      name="twitter:description"
      content="Deploy, orchestrate, and monitor AI coding agents across any LLM provider."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured Data -->

    <!-- Third-party browser analytics are intentionally not loaded by default. -->
  </head>

  </body>

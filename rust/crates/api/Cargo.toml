[package]
name = "agentforge-api"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[dependencies]
agentforge-core.workspace = true
agentforge-db.workspace = true
agentforge-auth.workspace = true
agentforge-infra.workspace = true
agentforge-jobs.workspace = true
agentforge-llm.workspace = true
agentforge-platform.workspace = true
axum.workspace = true
# `use_pem` adds RSA PEM parsing (GitHub App private keys ship as PEM). It pulls
# only `pem` + `simple_asn1`, NOT the RustCrypto `rsa` crate the workspace base
# deliberately excludes (RUSTSEC-2023-0071), so the security posture is unchanged.
jsonwebtoken = { workspace = true, features = ["use_pem"] }
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
futures.workspace = true
anyhow.workspace = true
chrono.workspace = true
async-trait.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
data-encoding.workspace = true
bollard.workspace = true
reqwest.workspace = true
lettre.workspace = true
redis.workspace = true
url.workspace = true
secrecy.workspace = true
zeroize.workspace = true
regex.workspace = true
serde_urlencoded = "0.7"
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
nkeys.workspace = true
async-nats.workspace = true
thiserror.workspace = true
async-stream.workspace = true

[features]
test-support = ["agentforge-llm/test-support"]

[dev-dependencies]
bcrypt = "0.19"
http = "1"
httpmock = "0.7"
metrics-util.workspace = true
agentforge-llm = { workspace = true, features = ["test-support"] }
agentforge-api = { path = ".", features = ["test-support"] }

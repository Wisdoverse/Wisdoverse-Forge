syntax = "proto3";

package platform;

option go_package = "agentforge/platform/proto";

message Empty {}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Pagination {
  int32 limit = 1;
  int32 offset = 2;
}

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

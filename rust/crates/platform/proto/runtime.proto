syntax = "proto3";

package platform;

option go_package = "agentforge/platform/proto";

import "common.proto";

service RuntimeService {
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc StartAgent(StartAgentRequest) returns (Empty);
  rpc StopAgent(StopAgentRequest) returns (Empty);
  rpc DestroyAgent(DestroyAgentRequest) returns (Empty);
  rpc SendPrompt(SendPromptRequest) returns (Empty);
  rpc ResumeAgent(ResumeAgentRequest) returns (Empty);
  rpc GetAgentOutput(GetOutputRequest) returns (GetOutputResponse);
  rpc StreamOutput(StreamOutputRequest) returns (stream OutputChunk);
  rpc ExecInAgent(ExecInAgentRequest) returns (ExecInAgentResponse);
  rpc IsAlive(IsAliveRequest) returns (IsAliveResponse);
  rpc SendRawInput(SendRawInputRequest) returns (Empty);
  rpc AttachTerminal(stream TerminalInput) returns (stream TerminalOutput);
}

message CreateAgentRequest {
  string agent_id = 1;
  string project_path = 2;
  string image = 3;
  map<string, string> env = 4;
  repeated AgentMount mounts = 5;
  string ssh_private_key = 6;
  string git_url = 7;
  string provider = 8;
  string model = 9;
  string api_key = 10;
  AgentResourceLimits resource_limits = 11;
}

// Session-level resource limits passed from the server to the platform.
// Zero/default values are ignored — the platform merges non-zero fields
// with its DefaultResourceLimits().
message AgentResourceLimits {
  double cpus = 1;
  int64 memory_mb = 2;
  int64 pids_limit = 3;
  int64 io_write_bps = 4;
  int64 io_read_bps = 5;
  int64 io_write_iops = 6;
  int64 io_read_iops = 7;
  int32 oom_score_adj = 8;
  bool git_lfs_enabled = 9;
}

message AgentMount {
  string source = 1;
  string target = 2;
  bool read_only = 3;
}

message CreateAgentResponse {
  string container_id = 1;
  string agent_id = 2;
}

message StartAgentRequest {
  string agent_id = 1;
  string initial_prompt = 2;
}

message StopAgentRequest {
  string agent_id = 1;
  int32 timeout_seconds = 2;
}

message DestroyAgentRequest {
  string agent_id = 1;
  bool force = 2;
}

message SendPromptRequest {
  string agent_id = 1;
  string prompt = 2;
  repeated string image_paths = 3;
}

message ResumeAgentRequest {
  string agent_id = 1;
  string prompt = 2;
}

message GetOutputRequest {
  string agent_id = 1;
  string since = 2;
}

message GetOutputResponse {
  string output = 1;
  string hash = 2;
}

message StreamOutputRequest {
  string agent_id = 1;
  int32 poll_interval_ms = 2;
}

message OutputChunk {
  string data = 1;
  string hash = 2;
  Timestamp timestamp = 3;
}

message ExecInAgentRequest {
  string agent_id = 1;
  repeated string cmd = 2;
}

message ExecInAgentResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

message IsAliveRequest {
  string agent_id = 1;
}

message IsAliveResponse {
  bool alive = 1;
  string state = 2;
}

message SendRawInputRequest {
  string agent_id = 1;
  repeated string keys = 2;
}

message TerminalInput {
  string agent_id = 1;
  bytes data = 2;
  TerminalResize resize = 3;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalOutput {
  bytes data = 1;
}

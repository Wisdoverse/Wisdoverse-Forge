# Vendored fork of sqlx 0.8.6 with the MySQL and SQLite driver optional deps
# removed. Used via [patch.crates-io] in ../../Cargo.toml.
#
# See ./README.md for why this fork exists and how to re-sync with upstream.

[package]
edition = "2021"
name = "sqlx"
version = "0.8.6"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
description = "🧰 The Rust SQL Toolkit (PostgreSQL-only fork for agentforge)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[dependencies.sqlx-core]
version = "=0.8.6"
features = [
    "offline",
    "migrate",
]

[dependencies.sqlx-macros]
version = "=0.8.6"
optional = true

[dependencies.sqlx-postgres]
version = "=0.8.6"
optional = true

[features]
_rt-async-std = []
_rt-tokio = []
_tls-native-tls = [
    "sqlx-core/_tls-native-tls",
    "sqlx-macros?/_tls-native-tls",
]
_tls-rustls-aws-lc-rs = [
    "sqlx-core/_tls-rustls-aws-lc-rs",
    "sqlx-macros?/_tls-rustls-aws-lc-rs",
]
_tls-rustls-ring-native-roots = [
    "sqlx-core/_tls-rustls-ring-native-roots",
    "sqlx-macros?/_tls-rustls-ring-native-roots",
]
_tls-rustls-ring-webpki = [
    "sqlx-core/_tls-rustls-ring-webpki",
    "sqlx-macros?/_tls-rustls-ring-webpki",
]
any = [
    "sqlx-core/any",
    "sqlx-postgres?/any",
]
bigdecimal = [
    "sqlx-core/bigdecimal",
    "sqlx-macros?/bigdecimal",
    "sqlx-postgres?/bigdecimal",
]
bit-vec = [
    "sqlx-core/bit-vec",
    "sqlx-macros?/bit-vec",
    "sqlx-postgres?/bit-vec",
]
bstr = ["sqlx-core/bstr"]
chrono = [
    "sqlx-core/chrono",
    "sqlx-macros?/chrono",
    "sqlx-postgres?/chrono",
]
default = [
    "any",
    "macros",
    "migrate",
    "json",
]
derive = ["sqlx-macros/derive"]
ipnet = [
    "sqlx-core/ipnet",
    "sqlx-macros?/ipnet",
    "sqlx-postgres?/ipnet",
]
ipnetwork = [
    "sqlx-core/ipnetwork",
    "sqlx-macros?/ipnetwork",
    "sqlx-postgres?/ipnetwork",
]
json = [
    "sqlx-core/json",
    "sqlx-macros?/json",
    "sqlx-postgres?/json",
]
mac_address = [
    "sqlx-core/mac_address",
    "sqlx-macros?/mac_address",
    "sqlx-postgres?/mac_address",
]
macros = [
    "derive",
    "sqlx-macros/macros",
]
migrate = [
    "sqlx-core/migrate",
    "sqlx-macros?/migrate",
    "sqlx-postgres?/migrate",
]
postgres = [
    "sqlx-postgres",
    "sqlx-macros?/postgres",
]
runtime-async-std = [
    "_rt-async-std",
    "sqlx-core/_rt-async-std",
    "sqlx-macros?/_rt-async-std",
]
runtime-async-std-native-tls = [
    "runtime-async-std",
    "tls-native-tls",
]
runtime-async-std-rustls = [
    "runtime-async-std",
    "tls-rustls-ring",
]
runtime-tokio = [
    "_rt-tokio",
    "sqlx-core/_rt-tokio",
    "sqlx-macros?/_rt-tokio",
]
runtime-tokio-native-tls = [
    "runtime-tokio",
    "tls-native-tls",
]
runtime-tokio-rustls = [
    "runtime-tokio",
    "tls-rustls-ring",
]
rust_decimal = [
    "sqlx-core/rust_decimal",
    "sqlx-macros?/rust_decimal",
    "sqlx-postgres?/rust_decimal",
]
time = [
    "sqlx-core/time",
    "sqlx-macros?/time",
    "sqlx-postgres?/time",
]
tls-native-tls = [
    "sqlx-core/_tls-native-tls",
    "sqlx-macros?/_tls-native-tls",
]
tls-none = []
tls-rustls = ["tls-rustls-ring"]
tls-rustls-aws-lc-rs = [
    "sqlx-core/_tls-rustls-aws-lc-rs",
    "sqlx-macros?/_tls-rustls-aws-lc-rs",
]
tls-rustls-ring = ["tls-rustls-ring-webpki"]
tls-rustls-ring-native-roots = [
    "sqlx-core/_tls-rustls-ring-native-roots",
    "sqlx-macros?/_tls-rustls-ring-native-roots",
]
tls-rustls-ring-webpki = [
    "sqlx-core/_tls-rustls-ring-webpki",
    "sqlx-macros?/_tls-rustls-ring-webpki",
]
uuid = [
    "sqlx-core/uuid",
    "sqlx-macros?/uuid",
    "sqlx-postgres?/uuid",
]

# The upstream src/ retains `#[cfg(feature = "mysql")]` / `"sqlite"` /
# `"_sqlite"` / `"sqlite-preupdate-hook"` / `"all-databases"` gates. We keep
# the source verbatim so re-syncing with upstream is a plain copy; explicitly
# list the removed feature names under check-cfg so the compiler knows they
# are intentional no-ops rather than typos.
[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(feature, values("mysql", "sqlite", "sqlite-unbundled", "sqlite-preupdate-hook", "_sqlite", "all-databases"))',
]

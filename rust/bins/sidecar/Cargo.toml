[package]
name = "agentforge-sidecar"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "agentforge-sidecar"
path = "src/main.rs"

[dependencies]
agentforge-core.workspace = true
agentforge-infra.workspace = true
agentforge-telemetry.workspace = true
async-nats.workspace = true
config.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
futures.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
metrics.workspace = true
libc.workspace = true
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"

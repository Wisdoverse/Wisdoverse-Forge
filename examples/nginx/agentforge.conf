# =============================================================================
# Wisdoverse Forge — example nginx site config
# =============================================================================
# Reference reverse-proxy config for the single-host docker-compose deploy.
# Adapt paths, server name, TLS certificate paths, and ALLOWED_ORIGINS for
# your environment before installing.
#
# Companion script: scripts/deploy.sh (see docs/deployment/single-host-compose.md).
#
# Required nginx behaviour:
#   - Serves the SPA from WEBROOT (matching scripts/deploy.sh `WEBROOT`).
#   - Follows symlinks under WEBROOT when scripts/deploy.sh runs in
#     `symlink` mode (the default).
#   - Forwards /api/, /health, /metrics, and /ws to the Rust API on
#     127.0.0.1:${AGENTFORGE_PORT}.
#   - Falls back to /index.html for client-side SPA routes.
# =============================================================================

upstream agentforge_api {
    # AGENTFORGE_PORT in docker/.env (default: 4003).
    server 127.0.0.1:4003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name forge.example.com;

    # Force HTTPS for everything except the ACME HTTP-01 challenge path.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forge.example.com;

    # ----- TLS -----
    # Replace with your certificate paths (ACME, internal CA, etc.).
    ssl_certificate     /etc/letsencrypt/live/forge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.example.com/privkey.pem;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- SPA root -----
    # Match the WEBROOT env var passed to scripts/deploy.sh.
    # Default left as the legacy path; change before installing if your
    # deploy writes elsewhere (e.g. /var/www/agentforge or
    # /www/sites/forge.example.com/index for 1Panel-managed hosts).
    root /opt/agentforge/www;
    index index.html;

    # `symlink` deploy mode swaps the root via `ln -sfn` + `mv -T`. nginx
    # follows symlinks by default; uncomment the line below ONLY if you
    # also operate scripts/deploy.sh in FRONTEND_DEPLOY_MODE=rsync.
    # disable_symlinks off;

    # ----- API + ops endpoints -----
    location /api/ {
        proxy_pass http://agentforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://agentforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Prometheus scrape — restrict source IPs in production.
    location = /metrics {
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://agentforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ----- WebSocket gateway -----
    location /ws {
        proxy_pass http://agentforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ----- Static asset caching -----
    # Vite emits hashed filenames under /assets/, so these are safe to cache
    # forever. Other assets get a short cache + revalidate.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache index.html — it pins the asset hashes.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # ----- SPA fallback -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
